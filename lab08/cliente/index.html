<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>EventFlow</h1>
    <form id="form-login">
      <input id="login-user" placeholder="Usuario" required>
      <input id="login-pass" type="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    <div id="sesion" hidden>
      <span>Sesión activa</span>
      <button id="btn-logout" type="button">Salir</button>
    </div>
  </header>

  <main>
    <div id="alerta" class="alerta" hidden></div>

    <section>
      <h2>Nuevo espacio</h2>
      <form id="form-espacio">
        <input id="e-nombre" placeholder="Nombre" required>
        <input id="e-ubicacion" placeholder="Ubicación / bloque" required>
        <input id="e-aforo" type="number" placeholder="Aforo máximo" required>
        <label><input id="e-estado" type="checkbox" checked> Operativo</label>
        <button type="submit">Guardar espacio</button>
      </form>
    </section>

    <section>
      <h2>Nuevo recurso técnico</h2>
      <form id="form-recurso">
        <input id="r-nombre" placeholder="Nombre del equipo" required>
        <input id="r-codigo" placeholder="Código de inventario" required>
        <input id="r-costo" type="number" step="0.01" placeholder="Costo" required>
        <input id="r-stock" type="number" placeholder="Stock" required>
        <select id="r-espacio" required></select>
        <button type="submit">Guardar recurso</button>
      </form>
    </section>

    <section>
      <h2>Espacios</h2>
      <div id="lista-espacios" class="grid"></div>
    </section>

    <section>
      <h2>Recursos técnicos</h2>
      <div id="lista-recursos" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
